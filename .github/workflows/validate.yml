name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml==6.0.3
      - run: python -B tools/validate.py
  python-3-9:
    name: Python 3.9 (minimum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Compile and run --help for every script
        run: |
          for f in */scripts/*.py; do
            python -B -c "import sys; compile(open(sys.argv[1], encoding='utf-8').read(), sys.argv[1], 'exec')" "$f"
            python -B "$f" -h > /dev/null
            echo "ok $f"
          done
      - run: python -B tools/validate.py
